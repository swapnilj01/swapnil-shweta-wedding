<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shweta weds Swapnil">
  <title>Shweta weds Swapnil</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="26%" r="82%">
      <stop offset="0%" stop-color="#6E0E24"/>
      <stop offset="62%" stop-color="#3A0813"/>
      <stop offset="100%" stop-color="#25050E"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9AE"/>
      <stop offset="52%" stop-color="#F7C66D"/>
      <stop offset="100%" stop-color="#C88B25"/>
    </linearGradient>
    <!-- One petal, pointing up from the centre. Reused eight times at 45deg steps. -->
    <path id="petal" d="M32 33 C25.4 24.2 25.2 15.4 32 7.5 C38.8 15.4 38.6 24.2 32 33 Z"/>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#gold)" stroke-width="1.6" opacity=".72"/>

  <g fill="url(#gold)">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(45 32 32)"/>
    <use href="#petal" transform="rotate(90 32 32)"/>
    <use href="#petal" transform="rotate(135 32 32)"/>
    <use href="#petal" transform="rotate(180 32 32)"/>
    <use href="#petal" transform="rotate(225 32 32)"/>
    <use href="#petal" transform="rotate(270 32 32)"/>
    <use href="#petal" transform="rotate(315 32 32)"/>
  </g>

  <circle cx="32" cy="32" r="5.6" fill="#3A0813"/>
  <circle cx="32" cy="32" r="3.4" fill="url(#gold)"/>
</svg>
